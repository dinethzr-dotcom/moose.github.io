<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moose T-Shirt Shops</title>

<style>
body { font-family: Arial, sans-serif; background: #f9f9f9; margin:0; padding:0; color: #333; }

/* Header */
header { background: #333; color: #fff; padding: 10px 20px; display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; }
header h1 { margin: 0; font-size: 1.5em; flex: 1 1 200px; text-align: center; }
header img { height: 50px; margin-right: 15px; }

/* Navigation */
nav { background: #444; padding: 10px 20px; display: flex; flex-wrap: wrap; justify-content: center; }
nav a { color: #fff; text-decoration: none; margin: 5px 15px; font-weight: bold; }
nav a:hover { color: #ffcc00; }

/* Filters */
.filters { text-align:center; margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
select { padding: 8px; font-size: 1em; min-width: 150px; }

/* Cards */
.shop-container { display: flex; flex-wrap: wrap; justify-content: center; margin: 10px; gap: 15px; }

.shop-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 280px;
    padding: 15px;
}

.shop-card h3 { margin-top: 0; }
.shop-card p { margin: 5px 0; font-size: 0.9em; }

.sizes span {
    background: #eee;
    border-radius: 4px;
    padding: 3px 6px;
    margin: 3px;
    font-size: 0.8em;
}

.color-dot {
    display: inline-block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    margin: 3px;
    border: 1px solid #ccc;
}

/* Preorder Button */
.preorder-btn {
    background: #ffcc00;
    border: none;
    padding: 8px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
    width: 100%;
}

.preorder-btn:hover { background: #e6b800; }

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    width: 90%;
    max-width: 400px;
}

.modal-content input,
.modal-content select {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
}

.close-btn {
    float: right;
    cursor: pointer;
    font-weight: bold;
    color: red;
}

#noShopsMessage {
    text-align: center;
    color: red;
    font-weight: bold;
    margin-top: 20px;
    display: none;
}
</style>
</head>

<body>

<header>
<img src="https://i.pinimg.com/1200x/e2/70/69/e270690ac163a85901930de53840ed4d.jpg">
<h1>Available At</h1>
</header>

<nav>
<a href="#">Available At</a>
<a href="#">Care Instructions</a>
<a href="#">Just Dropped</a>
</nav>

<div class="filters">
<select id="townSelect" onchange="filterShops()">
<option value="">--All Towns--</option>
<option value="Nugegoda">Nugegoda</option>
<option value="Kottawa">Kottawa</option>
<option value="Maharagama">Maharagama</option>
</select>
</div>

<div class="shop-container" id="shopsContainer">

<div class="shop-card" data-town="Nugegoda">
<h3>Cool Planet – Nugegoda</h3>
<p>27 S. De S. Jayasinghe Mawatha</p>
<button onclick="openPreorder(this)" class="preorder-btn">Pre-Order</button>
</div>

<div class="shop-card" data-town="Kottawa">
<h3>ZENN Clothing – Kottawa</h3>
<p>High-Level Road</p>
<button onclick="openPreorder(this)" class="preorder-btn">Pre-Order</button>
</div>

<div class="shop-card" data-town="Maharagama">
<h3>Fashion Factory – Maharagama</h3>
<p>High-Level Road</p>
<button onclick="openPreorder(this)" class="preorder-btn">Pre-Order</button>
</div>

</div>

<div id="noShopsMessage">❌ No shops found matching your filters!</div>

<!-- Preorder Modal -->
<div class="modal" id="preorderModal">
<div class="modal-content">
<span class="close-btn" onclick="closePreorder()">✖</span>
<h3>Pre-Order T-Shirt</h3>

<input type="text" id="shopName" readonly>
<input type="text" id="customerName" placeholder="Your Name">
<input type="tel" id="customerPhone" placeholder="Phone Number">

<select id="preorderSize">
<option value="">Select Size</option>
<option>XS</option><option>S</option><option>M</option>
<option>L</option><option>XL</option><option>XXL</option>
</select>

<select id="preorderColor">
<option value="">Select Color</option>
<option>Classic White</option>
<option>Jet Black</option>
<option>Heather Grey</option>
<option>Charcoal</option>
<option>Navy Blue</option>
</select>

<button onclick="submitPreorder()" class="preorder-btn">
Submit Pre-Order
</button>

</div>
</div>

<script>
function filterShops() {
const town = document.getElementById("townSelect").value;
const shops = document.querySelectorAll(".shop-card");
let anyVisible = false;

shops.forEach(shop => {
let show = true;
if (town && shop.dataset.town !== town) show = false;
shop.style.display = show ? "block" : "none";
if(show) anyVisible = true;
});

document.getElementById("noShopsMessage").style.display =
anyVisible ? "none" : "block";
}

function openPreorder(button) {
const shopCard = button.closest(".shop-card");
const shopName = shopCard.querySelector("h3").innerText;
document.getElementById("shopName").value = shopName;
document.getElementById("preorderModal").style.display = "flex";
}

function closePreorder() {
document.getElementById("preorderModal").style.display = "none";
}

function submitPreorder() {
const name = document.getElementById("customerName").value;
const phone = document.getElementById("customerPhone").value;
const size = document.getElementById("preorderSize").value;
const color = document.getElementById("preorderColor").value;
const shop = document.getElementById("shopName").value;

if (!name || !phone || !size || !color) {
alert("Please fill all fields!");
return;
}

alert(`✅ Pre-Order Submitted!

Shop: ${shop}
Name: ${name}
Size: ${size}
Color: ${color}`);

closePreorder();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("preorderSize").value="";
document.getElementById("preorderColor").value="";
}
</script>

</body>
</html>
